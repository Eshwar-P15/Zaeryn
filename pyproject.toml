[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zaeryn"
version = "0.7.0"
requires-python = ">=3.12"
description = "Multi-asset quantitative trading research system."
readme = "README.md"
dependencies = [
    "requests>=2.31,<3.0",
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "python-dotenv>=1.0,<2.0",
    "twikit>=2.2,<3.0",
    "textblob>=0.17,<1.0",
    "aiohttp>=3.9,<4.0",
    "xgboost>=2.0,<4.0",
    "scikit-learn>=1.3,<2.0",
    "joblib>=1.3,<2.0",
    "ta>=0.10.2,<1.0",
    "matplotlib>=3.7,<4.0",
    "seaborn>=0.12,<1.0",
    "tabulate>=0.9,<1.0",
    "optuna>=3.4,<5.0",
    "streamlit>=1.28,<2.0",
    "plotly>=5.17,<7.0",
    "yfinance>=0.2.40,<1.0",
    "vaderSentiment>=3.3.2,<4.0",
    "pydantic-settings>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
    "pre-commit>=3.5",
]
mlflow = [
    "mlflow>=2.10",
]

[tool.hatch.build.targets.wheel]
packages = [
    "backtest",
    "config",
    "data",
    "models",
    "risk",
    "sentiment",
    "utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external APIs",
]

[tool.ruff]
line-length = 100
target-version = "py312"
